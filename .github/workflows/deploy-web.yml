name: Deploy Web (GitHub Pages)

# Déploie l'export web statique sur GitHub Pages.
# Prérequis dans le dépôt : Settings → Pages → Source = GitHub Actions,
# et la variable de dépôt EXPO_PUBLIC_API_URL pointant vers l'API déployée.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web
        env:
          # Sous-chemin des Pages « projet » : https://<owner>.github.io/<repo>/
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # URL publique de l'API (variable de dépôt, jamais un secret).
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npm run export:web

      - name: Disable Jekyll (sert les dossiers _expo)
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
