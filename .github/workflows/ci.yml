name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Générer expo-env.d.ts
        # Fichier gitignore (recommandation Expo), normalement régénéré au
        # premier `expo start`. En CI, rien ne lance jamais le serveur de
        # dev avant `tsc` : sans lui, la référence de triple-slash vers
        # `expo/types` (qui déclare `declare module '*.css'`) est absente et
        # le typecheck échoue sur l'import de src/app/_layout.tsx. Contenu
        # strictement identique à celui qu'Expo générerait.
        run: |
          cat > expo-env.d.ts << 'EOF'
          /// <reference types="expo/types" />

          // NOTE: This file should not be edited and should be in your git ignore
          EOF

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests + couverture
        run: npm run test:coverage -- --ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api-books-v2
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed and start API
        working-directory: api-books-v2
        run: |
          # data/ n'est pas versionné (voir docs/API-ECARTS.md) et db.js
          # écrit dans data/db.json.tmp sans jamais créer le dossier : sur
          # un clone neuf, `npm run seed` échoue avec ENOENT. api-books-v2/
          # n'est jamais modifié — le dossier est créé ici, côté CI.
          mkdir -p data
          npm run seed
          node src/server.js &
          npx wait-on http://localhost:3000/health

      - name: Run E2E (Playwright starts the web server)
        # e2e/scenario-recette.spec.ts (chapitre 4.6) a besoin de l'API en
        # mode authentifié avec un TTL de jeton raccourci (voir son en-tête)
        # — pas le mode normal démarré ci-dessus. Ciblé explicitement plutôt
        # que `npm run e2e` (qui prendrait aussi ce fichier et échouerait
        # faute du bon mode). Se lance à part : `npm run e2e:recette`.
        run: npx playwright test e2e/parcours-critique.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
